---
name: Test Pascal script with arithmetic output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pascal script with arithmetic
        run: |
          cat > "$GITHUB_WORKSPACE/tests/arithmetic.pas" << 'EOF'
          program Arithmetic;
          var
            a, b, sum: Integer;
          begin
            a := 10;
            b := 32;
            sum := a + b;
            WriteLn(sum);
          end.
          EOF
      - id: action
        uses: .
        with:
          path: tests/arithmetic.pas
      - name: Assert arithmetic result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "42"; then
            echo "FAIL: expected '42' in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
