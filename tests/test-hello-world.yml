name: Test Pascal action - Hello World
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Pascal script at workspace root
        run: |
          printf 'program HelloWorld;\nbegin\n  WriteLn('"'"'Hello World!'"'"');\nend.\n' > "$GITHUB_WORKSPACE/HelloWorld.pas"
      - id: action
        uses: .
        with:
          path: ./HelloWorld.pas
      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Hello World!" ]; then
            echo "FAIL: expected 'Hello World!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
