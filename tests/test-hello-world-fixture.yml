---
name: Test Pascal script using bundled HelloWorld.pas fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/hello.pas
      - name: Assert result contains Hello World
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Hello World"; then
            echo "PASS: output contains 'Hello World'"
          else
            echo "FAIL: expected output to contain 'Hello World' but got '$ACTUAL'"
            exit 1
          fi
