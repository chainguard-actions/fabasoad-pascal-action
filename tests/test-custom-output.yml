---
name: Test Pascal script with custom output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/custom.pas

      - name: Assert result output contains expected string
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "Pascal action test passed"; then
            echo "PASS: result contains expected output"
          else
            echo "FAIL: expected 'Pascal action test passed', got: $ACTUAL"
            exit 1
          fi
