---
name: Test custom Pascal script output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/Greet.pas
      - name: Assert result contains greeting
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Greetings from Pascal!" ]; then
            echo "FAIL: expected 'Greetings from Pascal!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
