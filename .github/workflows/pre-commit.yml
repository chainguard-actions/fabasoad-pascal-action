---
name: Pre-commit

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: sh

env:
  SKIP: no-commit-to-branch

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fabasoad/pre-commit-container:latest@sha256:fecc92b1ff972326be0bdffa956c16e957be05047120936dbe97ff283d9fea15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Update git config
        run: git config --global --add safe.directory "$(pwd)"
      - name: Run pre-commit on changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_SHA: ${{ github.sha }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          pre-commit run --to-ref "$GH_SHA" --from-ref "origin/$GH_BASE_REF" --hook-stage=commit
          pre-commit run --to-ref "$GH_SHA" --from-ref "origin/$GH_BASE_REF" --hook-stage=push
      - name: Run pre-commit on all files
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          pre-commit run --hook-stage=commit --all-files
          pre-commit run --hook-stage=push --all-files
