---
name: Functional tests (Remote)

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"

permissions: {}

jobs:
  functional-tests:
    name: Functional tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: fabasoad/pascal-action@489a5dc854922250f778319ee7060e7fe764b906 # main
        id: pascal
        with:
          path: ./HelloWorld.pas
      - name: Validate result
        env:
          PASCAL_RESULT: ${{ steps.pascal.outputs.result }}
        run: |
          [[ "Hello World!" == "$PASCAL_RESULT" ]] || exit 1;
