---
name: Functional tests (Local)

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  functional_tests:
    name: Functional tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./
        id: pascal
        with:
          path: ./HelloWorld.pas
      - name: Validate result
        env:
          PASCAL_RESULT: ${{ steps.pascal.outputs.result }}
        run: |
          [[ "Hello World!" == "$PASCAL_RESULT" ]] || exit 1;
